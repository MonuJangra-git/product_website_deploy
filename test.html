<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Simple Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        header, footer {
            background: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }
        nav {
            margin: 15px 0;
        }
        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
        }
        section {
            background: white;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Site</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h2>Home</h2>
        <p>This is a simple homepage with basic navigation.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>Here you can write something about yourself or your project.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@example.com</p>
    </section>

    <footer>
        <p>&copy; 2 oct 2026 </p>
    </footer>
</body>
</html>
