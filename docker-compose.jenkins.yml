services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports:
      - 8080:8080
      - 50000:50000
    container_name: jenkins_container
    restart: unless-stopped
    networks: 
      - webnet
    volumes:
      - jenkins_home:/var/jenkins_home

networks:
  webnet:

volumes:
  jenkins_home:

