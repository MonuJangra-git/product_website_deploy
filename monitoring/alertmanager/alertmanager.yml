global:
  resolve_timeout: 2m
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'job']
  
  # Wait this long to collect alerts into a group before sending
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  
  routes:
    # Send critical alerts immediately via different receiver
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s          # Send faster for critical alerts
      repeat_interval: 1h      # Repeat every hour
    
    # Warning alerts go to default but less urgently
    - match:
        severity: warning
      receiver: 'default-receiver'
      repeat_interval: 6h

# RECEIVERS
# Define WHERE to send alerts (email, slack, webhook, etc.)
receivers:

  # Default receiver - Email notifications
  - name: 'default-receiver'
    email_configs:
      - to: ${ALERT_RECEIVER_EMAIL}
        from: ${SENDERS_EMAIL}
        smarthost: 'smtp.gmail.com:587'
        auth_username: ${SENDERS_EMAIL}
        auth_password: ${SENDERS_EMAIL_PASSWORD}
        send_resolved: true    # Send notification when alert resolves too
  - name: 'critical-receiver'
    email_configs:
      - to: ${ALERT_RECEIVER_EMAIL}
        from: ${SENDERS_EMAIL}
        smarthost: 'smtp.gmail.com:587'
        auth_username: ${SENDERS_EMAIL}
        auth_password: ${SENDERS_EMAIL_PASSWORD}
        send_resolved: true
        headers:
          Subject: 'CRITICAL ALERT: {{ .CommonAnnotations.summary }}'
