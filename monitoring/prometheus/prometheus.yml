global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # Monitor the server
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"